<svg xmlns="http://www.w3.org/2000/svg" lang="zh-Hant" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">Ch21 篩選與評估</title><desc id="d">搜尋結果先經產品、分類與有效狀態篩選，再用 qrels 評估是否找對。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4f5d75"/></marker></defs><rect width="1000" height="360" fill="#f5f5f5"/><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="600" fill="#5a6580"><text x="70" y="52">01 · CANDIDATES</text><text x="405" y="52">02 · FILTER</text><text x="745" y="52">03 · EVALUATE</text></g><path d="M300 170H390M665 170H735" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#a)"/><g stroke="#2d3142" stroke-width="1.5"><rect x="70" y="105" width="230" height="130" rx="6" fill="#f5f5f5"/><rect x="390" y="90" width="275" height="160" rx="6" fill="#f5f5f5"/><rect x="735" y="105" width="195" height="130" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="2"/></g><g fill="#2d3142" font-family="Inter,'Noto Sans TC',system-ui,sans-serif" font-size="20" font-weight="650"><text x="100" y="155">向量候選</text><text x="420" y="155">安全條件</text><text x="765" y="155">qrels 評估</text></g><g fill="#5a6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12"><text x="100" y="185">Top-K chunks</text><text x="100" y="212">可能相似，不代表可用</text><text x="420" y="190">產品 · 分類 · active</text><text x="420" y="214">EXISTS 唯一合格集合</text><text x="765" y="185">precision / recall</text><text x="765" y="212">是否真的找對？</text></g><rect x="354" y="286" width="292" height="38" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,.16)"/><text x="500" y="311" text-anchor="middle" fill="#4f5d75" font-family="Georgia,'Noto Serif TC',serif" font-size="18" font-style="italic">相似不等於合格，結果要接受規則檢查</text></svg>