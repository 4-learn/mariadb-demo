<svg xmlns="http://www.w3.org/2000/svg" lang="zh-Hant" viewBox="0 0 1100 500" role="img" aria-labelledby="hw24-title hw24-desc"><title id="hw24-title">HW24 增量驗收流程</title><desc id="hw24-desc">先記錄操作前狀態，再執行成功與故意失敗，最後比較前後資料並整理報告。</desc><defs><marker id="hw24-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4f5d75"/></marker></defs><rect width="1100" height="500" fill="#f5f5f5"/><text x="56" y="52" fill="#5a6580" font-family="monospace" font-size="13" font-weight="600">HW24 · ACCEPTANCE</text><text x="56" y="96" fill="#2d3142" font-family="Georgia,serif" font-size="32" font-weight="600">把「成功」變成可以核對的證據</text><path d="M230 250H300M500 250H570M770 250H840" stroke="#4f5d75" stroke-width="2.5" fill="none" marker-end="url(#hw24-arrow)"/><g stroke="#2d3142" stroke-width="1.5"><rect x="56" y="180" width="174" height="140" rx="7" fill="#f5f5f5"/><rect x="300" y="180" width="200" height="140" rx="7" fill="#f5f5f5"/><rect x="570" y="180" width="200" height="140" rx="7" fill="#f5f5f5"/><rect x="840" y="180" width="204" height="140" rx="7" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="2"/></g><g fill="#2d3142" font-family="Inter,'Noto Sans TC',sans-serif"><text x="82" y="222" font-size="20" font-weight="650">先拍照</text><text x="82" y="258" font-size="14">before snapshot</text><text x="82" y="284" font-size="13">原文、版本、hash</text><text x="326" y="222" font-size="20" font-weight="650">執行測試</text><text x="326" y="258" font-size="14">成功、故意失敗</text><text x="326" y="284" font-size="14">stale、還原</text><text x="596" y="222" font-size="20" font-weight="650">前後比較</text><text x="596" y="258" font-size="14">SQL / snapshot</text><text x="596" y="284" font-size="14">before 是否等於 after</text><text x="866" y="222" font-size="20" font-weight="650">可重做報告</text><text x="866" y="258" font-size="14">實際輸出</text><text x="866" y="280" font-size="14">已驗證／未驗證</text></g><text x="550" y="410" text-anchor="middle" fill="#4f5d75" font-family="Georgia,serif" font-size="20" font-style="italic">不是只看成功畫面，而是留下別人能重新核對的證據</text></svg>