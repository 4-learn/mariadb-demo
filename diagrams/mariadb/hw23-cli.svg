<svg xmlns="http://www.w3.org/2000/svg" lang="zh-Hant" viewBox="0 0 1100 500" role="img" aria-labelledby="hw23-title hw23-desc"><title id="hw23-title">HW23 CLI 串接流程</title><desc id="hw23-desc">命令列輸入經過固定問題或新問題模式，查詢 MariaDB 後輸出可追溯候選。</desc><defs><marker id="hw23-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4f5d75"/></marker></defs><rect width="1100" height="500" fill="#f5f5f5"/><text x="56" y="52" fill="#5a6580" font-family="monospace" font-size="13" font-weight="600">HW23 · CLI</text><text x="56" y="96" fill="#2d3142" font-family="Georgia,serif" font-size="32" font-weight="600">把前面學過的功能串成一個命令</text><path d="M230 250H300M500 250H570M770 250H840" stroke="#4f5d75" stroke-width="2.5" fill="none" marker-end="url(#hw23-arrow)"/><g stroke="#2d3142" stroke-width="1.5"><rect x="56" y="180" width="174" height="140" rx="7" fill="#f5f5f5"/><rect x="300" y="180" width="200" height="140" rx="7" fill="#f5f5f5"/><rect x="570" y="180" width="200" height="140" rx="7" fill="#f5f5f5"/><rect x="840" y="180" width="204" height="140" rx="7" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="2"/></g><g fill="#2d3142" font-family="Inter,'Noto Sans TC',sans-serif"><text x="82" y="222" font-size="20" font-weight="650">命令列輸入</text><text x="82" y="258" font-family="monospace" font-size="13">--case Q01</text><text x="82" y="282" font-family="monospace" font-size="13">--artifact</text><text x="326" y="222" font-size="20" font-weight="650">選擇模式</text><text x="326" y="258" font-size="14">固定問題，或新問題</text><text x="326" y="284" font-size="14">不偷偷 fallback</text><text x="596" y="222" font-size="20" font-weight="650">搜尋資料庫</text><text x="596" y="258" font-size="14">category 篩選</text><text x="596" y="284" font-size="14">exact Top-K</text><text x="866" y="222" font-size="20" font-weight="650">可追溯輸出</text><text x="866" y="258" font-family="monospace" font-size="12">chunk_id</text><text x="866" y="280" font-family="monospace" font-size="12">version · distance</text></g><text x="550" y="410" text-anchor="middle" fill="#4f5d75" font-family="Georgia,serif" font-size="20" font-style="italic">找不到答案時，誠實輸出空結果或錯誤</text></svg>