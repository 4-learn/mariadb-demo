<svg xmlns="http://www.w3.org/2000/svg" lang="zh-Hant" viewBox="0 0 1200 520" role="img" aria-labelledby="hw23g-title hw23g-desc"><title id="hw23g-title">HW23 引導式作業</title><desc id="hw23g-desc">HW23 先執行固定 Q01，再請 Agent 解釋，接著執行 Q05 Q08 Q99，最後完成可追溯 CLI。</desc><defs><marker id="hw23g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4f5d75"/></marker></defs><rect width="1200" height="520" fill="#f5f5f5"/><text x="56" y="52" fill="#5a6580" font-family="monospace" font-size="13" font-weight="600">HW23 · GUIDED HOMEWORK</text><text x="56" y="96" fill="#2d3142" font-family="Georgia,serif" font-size="32" font-weight="600">先照著做，再自己整合</text><path d="M246 255H300M536 255H590M826 255H880" stroke="#4f5d75" stroke-width="2.5" fill="none" marker-end="url(#hw23g-arrow)"/><g stroke="#2d3142" stroke-width="1.5"><rect x="56" y="180" width="190" height="150" rx="7" fill="#f5f5f5"/><rect x="300" y="180" width="236" height="150" rx="7" fill="#f5f5f5"/><rect x="590" y="180" width="236" height="150" rx="7" fill="#f5f5f5"/><rect x="880" y="180" width="264" height="150" rx="7" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="2"/></g><g fill="#2d3142" font-family="Inter,'Noto Sans TC',sans-serif"><text x="82" y="222" font-size="20" font-weight="650">1. 固定 Q01</text><text x="82" y="258" font-size="14">先看成功輸出</text><text x="82" y="284" font-size="13">chunk / version / distance</text><text x="326" y="222" font-size="20" font-weight="650">2. 請 Agent 解釋</text><text x="326" y="258" font-size="14">不修改、不執行</text><text x="326" y="284" font-size="14">先理解每個欄位</text><text x="616" y="222" font-size="20" font-weight="650">3. Q05/Q08/Q99</text><text x="616" y="258" font-size="14">有候選、空結果、拒絕</text><text x="616" y="284" font-size="14">保留真實錯誤</text><text x="906" y="222" font-size="20" font-weight="650">4. 完成 CLI</text><text x="906" y="258" font-size="14">可追溯 JSON</text><text x="906" y="284" font-size="14">不是模型回答</text></g><text x="600" y="420" text-anchor="middle" fill="#4f5d75" font-family="Georgia,serif" font-size="20" font-style="italic">先給路線，再要求學生整合</text></svg>